name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v1.0.0-rc4'
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository
        run: ./scripts/validate.sh

      - name: Install SDK host dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget curl zstd

      - name: Build APK with OpenWrt 25.12.4 SDK
        run: ./scripts/build-apk.sh

      - name: Release check
        run: ./scripts/release-check.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          name: NeoVPN ${{ github.ref_name }}
          files: |
            dist/SHA256SUMS
            dist/luci-theme-neovpn_all.apk
            dist/luci-theme-neovpn_all.apk.sha256
            dist/luci-theme-neovpn_*.apk
            dist/luci-theme-neovpn_*.apk.sha256
            dist/install.sh
            dist/install.sh.sha256
            dist/uninstall.sh
            dist/uninstall.sh.sha256
